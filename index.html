<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Grendy Agusti's retro portfolio" />
  <title>Portfolio</title>
  <link rel="icon" type="image/png" href="img/window.png" />
  <link rel="stylesheet" href="css/win31.css" />
</head>
<body>
  <div id="desktop" class="desktop">
    <div class="desktop-icons" id="desktopIcons"></div>
  </div>

  <div class="window-frame window" id="aboutWindow">
    <div class="window-titlebar">
      <span class="window-title-icon-wrap">
        <img class="window-title-icon" src="img/note.png" alt="window icon" width="16" height="16" />
      </span>
      <span class="window-title-text">Notepad</span>
      <div class="window-actions">
        <button class="window-action win-btn-min" aria-label="Minimize">_</button>
        <button class="window-action win-btn-max" aria-label="Maximize">□</button>
        <button class="window-action close-btn win-btn-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="window-body">
      <div class="about-content">
        <h1 id="aboutName">Grendy</h1>
        <h2 id="aboutRole">Developer</h2>
        <p id="aboutBio1">Bio 1</p>
        <p id="aboutBio2">Bio 2</p>
        <div class="about-actions">
          <button id="aboutBtn" class="retro-btn">Explore Projects</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sticky-note" id="stickyNote">
    <div class="sticky-header">
      <span class="sticky-title">Quick Guide</span>
    </div>
    <div class="sticky-content"></div>
  </div>

  <aside class="app-window window" id="projectsWindow">
    <div class="window-titlebar">
      <span class="window-title-icon-wrap">
        <img class="window-title-icon" src="img/folder.png" alt="projects icon" width="16" height="16" />
      </span>
      <span class="window-title-text">Projects</span>
      <div class="window-actions">
        <button class="window-action win-btn-min" aria-label="Minimize">_</button>
        <button class="window-action win-btn-max" aria-label="Maximize">□</button>
        <button class="window-action close-btn win-btn-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="window-body project-grid" id="projectsGrid"></div>
  </aside>

  <aside class="app-window window" id="skillsWindow">
    <div class="window-titlebar">
      <span class="window-title-icon-wrap">
        <img class="window-title-icon" src="img/cpl.png" alt="skills icon" width="16" height="16" />
      </span>
      <span class="window-title-text">Skills</span>
      <div class="window-actions">
        <button class="window-action win-btn-min" aria-label="Minimize">_</button>
        <button class="window-action win-btn-max" aria-label="Maximize">□</button>
        <button class="window-action close-btn win-btn-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="window-body skills-content" id="skillsContent"></div>
  </aside>

  <aside class="app-window window" id="contactWindow">
    <div class="window-titlebar">
      <span class="window-title-icon-wrap">
        <img class="window-title-icon" src="img/mail.png" alt="contact icon" width="16" height="16" />
      </span>
      <span class="window-title-text">Mail Me</span>
      <div class="window-actions">
        <button class="window-action win-btn-min" aria-label="Minimize">_</button>
        <button class="window-action win-btn-max" aria-label="Maximize">□</button>
        <button class="window-action close-btn win-btn-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="window-body contact-content">
      <form id="contactForm" method="POST" action="https://formspree.io/f/mjgnjbkr">
        <label>To:<input type="text" readonly value="grendy.xpplg2@gmail.com" /></label>
        <label>Your Name:<input type="text" name="name" required /></label>
        <label>Your Email:<input type="email" name="email" required /></label>
        <label>Message:<textarea name="message" required></textarea></label>
        <div class="form-actions">
          <button type="submit" class="retro-btn">Send Message</button>
          <button type="button" class="retro-btn secondary">Cancel</button>
        </div>
      </form>
    </div>
  </aside>

  <div id="asciiWindow" class="app-window ascii-window window">
    <div class="window-titlebar">
      <span class="window-title-icon-wrap">
        <img class="window-title-icon" src="img/ace.png" alt="ascii icon" width="16" height="16" />
      </span>
      <span class="window-title-text">RUPA.EXE</span>
      <div class="window-actions">
        <button class="window-action win-btn-min" aria-label="Minimize">_</button>
        <button class="window-action win-btn-max" aria-label="Maximize">□</button>
        <button class="window-action close-btn win-btn-close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="window-body ascii-body"></div>
  </div>

  <div class="desktop-footer">
    <button class="retro-btn start-btn" id="startBtn">
      <span class="start-btn-icon" id="startBtnIcon">◫</span>
      <span>Start</span>
    </button>
    <div class="taskbar-windows" id="taskbarWindows"></div>
    <div class="taskbar-tray" id="taskbarClock">12:00</div>
  </div>

  <div class="start-menu" id="startMenu">
    <div class="start-menu-banner">
      <span>Start</span>
    </div>
    <button class="start-menu-item" data-target="aboutWindow">Notepad</button>
    <button class="start-menu-item" data-target="projectsWindow">Projects</button>
    <button class="start-menu-item" data-target="skillsWindow">Skills</button>
    <button class="start-menu-item" data-target="contactWindow">Mail Me</button>
    <button class="start-menu-item" data-target="asciiWindow">RUPA.EXE</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ascii_data.js"></script>
  <script src="js/window_manager.js"></script>
  <script src="js/ascii_app.js"></script>
  <script>
    (function initPortfolioFromConfig() {
      const cfg = window.PORTFOLIO_CONFIG;
      if (!cfg) return;

      if (cfg.meta && cfg.meta.title) {
        document.title = cfg.meta.title;
      }

      if (cfg.meta && cfg.meta.favicon) {
        let faviconLink = document.querySelector('link[rel="icon"]');
        if (!faviconLink) {
          faviconLink = document.createElement('link');
          faviconLink.rel = 'icon';
          document.head.appendChild(faviconLink);
        }
        faviconLink.href = cfg.meta.favicon;
      }

      if (cfg.images) {
        const startIconSrc = cfg.images.startLogo || (cfg.images.startLogo === "" ? "" : cfg.images.logoMark);
        if (startIconSrc && startIconSrc.trim() !== '') {
          const startIconEl = document.getElementById('startBtnIcon');
          if (startIconEl) {
            startIconEl.innerHTML = `<img src="${startIconSrc}" width="16" height="16" style="image-rendering: pixelated; object-fit: contain;" alt="Start" onerror="this.style.display='none'; console.warn('Failed loading image', this.src)" />`;
          }
        }

        if (cfg.images.logoMark && cfg.images.logoMark.trim() !== '') {
          document.querySelectorAll('.window-title-icon').forEach(img => {
            img.onerror = function () {
              console.warn('Failed loading image', this.src);
              this.style.display = 'none';
            };
            img.src = cfg.images.logoMark;
          });
        }
      }
    })();
  </script>
</body>
</html>
